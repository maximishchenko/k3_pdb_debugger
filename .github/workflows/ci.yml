name: CI

on:
    push:
        branches-ignore: [main]
    pull_request:

env:
    # requires-python в pyproject.toml — ">=3.7", а .python-version в
    # репозитории закреплён на 3.7 для локальной разработки под реальный
    # встроенный интерпретатор К3-Мебель. Но GitHub больше не поставляет
    # сборки Python 3.7 для актуальных образов раннеров (actions/setup-python
    # падает с "was not found for Ubuntu 24.04"), а сам код версия-
    # независимый (чистый Python, from __future__ import annotations).
    # Поэтому в CI инструменты запускаются под современным Python; за
    # совместимость с 3.7 отвечают target-version/python_version в
    # конфигурации ruff и mypy (pyproject.toml), а не сам интерпретатор.
    UV_PYTHON: "3.11"

jobs:
    # ruff — статический анализ, не исполняет и не импортирует код,
    # поэтому спокойно работает на Ubuntu.
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: astral-sh/setup-uv@v10.1.0
              with:
                  enable-cache: true

            - name: Run lint
              run: make lint-all

    # mypy тоже статический анализ и не требует реальной Windows-машины:
    # платформа и версия для проверки типов заданы явно (platform = "win32",
    # python_version = "3.7" в [tool.mypy] pyproject.toml), поэтому
    # Windows-only тайпшеды ctypes (windll, wintypes и т.п.) резолвятся
    # корректно и на Ubuntu под современным Python.
    typing:
        name: Typing
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: astral-sh/setup-uv@v10.1.0
              with:
                  enable-cache: true

            - name: Run typing
              run: make typing-all

    # src/k3_pdb_debugger/io.py на уровне модуля обращается к ctypes.windll.kernel32 — атрибута,
    # которого в стандартной библиотеке просто не существует вне Windows - используется windows-latest.
    tests:
        name: Tests (coverage)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5

            - uses: astral-sh/setup-uv@v10.1.0
              with:
                  enable-cache: true

            - name: Install make
              run: choco install make --no-progress -y

            - name: Run tests with coverage
              run: make coverage
